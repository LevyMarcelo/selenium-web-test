plugins {
    id 'java'
}

group 'br.com.selenium'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.54.0'
    implementation group: 'io.github.bonigarcia', name: 'webdrivermanager', version: '5.4.0'
    testImplementation group: 'org.testng', name: 'testng', version: '7.6.1'
    testImplementation group: 'org.hamcrest', name: 'hamcrest-all', version: '1.3'
}

def selectedSuite = project.findProperty('suite') ?: 'headless_test'
def suiteFile = file("src/test/resources/${selectedSuite}.xml")

if (!suiteFile.exists()) {
    throw new GradleException("Suite não encontrada: ${selectedSuite}")
}

test {
    useTestNG {
        suites suiteFile
    }
}
